[package]
name = "skyrc-mc5000"
# Released on its own (tags `skyrc-mc5000-v*`), independent of the apps' version.
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unofficial client for the SkyRC MC5000 battery charger over Bluetooth LE: protocol frames, a paced session, slot status and charge history"
documentation = "https://docs.rs/skyrc-mc5000"
readme = "README.md"
keywords = ["skyrc", "mc5000", "charger", "battery", "bluetooth"]
categories = ["hardware-support"]
include = ["src/**/*.rs", "examples/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
btleplug = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
